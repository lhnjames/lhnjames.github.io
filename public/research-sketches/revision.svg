<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#555"/></marker></defs><rect x="9" y="9" width="582" height="422" rx="13" fill="white" stroke="#e2e2e2"/><g font-family="Georgia, 'Times New Roman', serif" fill="#222"><text x="300" y="47" font-size="25" text-anchor="middle">Revision ≠ Reliability</text><rect x="69" y="95" width="462" height="53" rx="6" fill="#fff0ca" stroke="#929da5"/><text x="300" y="128.5" font-size="20" text-anchor="middle">Stage 1: initial answer</text><path d="M300 148L300 180" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="69" y="188" width="462" height="53" rx="6" fill="#dbeaf5" stroke="#929da5"/><text x="300" y="221.5" font-size="20" text-anchor="middle">Stage 2: prompt-framed revision</text><path d="M193 241L150 285" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M407 241L450 285" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="37" y="294" width="238" height="59" rx="6" fill="#e9e4f1" stroke="#929da5"/><text x="156" y="330.5" font-size="20" text-anchor="middle">How often revised?</text><rect x="325" y="294" width="238" height="59" rx="6" fill="#e0efdf" stroke="#929da5"/><text x="444" y="330.5" font-size="20" text-anchor="middle">Did it improve?</text><text x="300" y="335" font-size="33" text-anchor="middle">≠</text><text x="300" y="399" font-size="18" text-anchor="middle">Revision frequency is not revision correctness</text></g></svg>
